<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de cadastro e controle de produtos de uma loja de roupas.">
    <title>MVP - Loja de Roupas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Minha Loja de Roupas</h1>
        <p>Bem-vindo ao nosso comércio!</p>


    <section aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastro de Produtos</h2>

        <form id="form-produto">
            <div>
                <label for="nome">Nome do produto:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>

            <div>
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    name="preco"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>

            <div>
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    min="0"
                    step="1"
                    required
                >
            </div>

            <button type="submit">Cadastrar produto</button>
        </form>

        <p
            id="mensagem"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></p>
    </section>
</main>

<script type="module" src="script.js"></script>


</body>
</html>
